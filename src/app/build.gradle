plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.corrigeai.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.corrigeai.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.2'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'androidx.multidex:multidex:2.0.1'

    // Driver JDBC do MySQL — permite conectar direto no banco a partir do app
    // IMPORTANTE: versão 5.1.x (não a 8.x), porque a 8.x usa classes do
    // java.sql que não existem no Android (java.sql.SQLType) e derruba o app
    // com NoClassDefFoundError.
    implementation 'mysql:mysql-connector-java:5.1.49'

    // Coroutines (rodar o JDBC fora da thread principal)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
